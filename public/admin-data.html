<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>공고 데이터 관리 | 청약 알림</title><link rel="stylesheet" href="./app.css?v=20261112"><link rel="stylesheet" href="./admin.css?v=20261112"><link rel="stylesheet" href="./admin-data.css?v=20261112"></head>
<body><div class="app-shell admin-shell"><header class="app-header"><div class="header-main"><a class="brand" href="/admin.html" aria-label="청약 알림 관리자 홈">청약<span>알림</span></a><span class="admin-label">관리자</span><div class="admin-header-links"><a href="/admin.html">수집 관리</a><a href="/#announcements">사용자 화면으로</a></div></div></header>
<main class="admin-main admin-data-main"><div class="view-heading"><div><h1>공고 데이터 관리</h1><p>PDF 등록부터 정보 확인, 운영 반영까지 한곳에서 처리합니다.</p></div><a class="official" href="/admin-import.html">PDF 등록</a></div>
<nav class="admin-data-tabs" aria-label="공고 데이터 관리 메뉴"><a class="is-active" href="#work">작업함</a><span aria-disabled="true">일괄 편집 <em>준비 중</em></span><span aria-disabled="true">반영 이력 <em>준비 중</em></span></nav>
<section class="admin-work-summary" aria-label="작업 상태 요약"><button type="button" data-status="REVIEW_REQUIRED"><span>확인 필요</span><strong id="count-review">-</strong></button><button type="button" data-status="READY_TO_PUBLISH"><span>반영 가능</span><strong id="count-ready">-</strong></button><button type="button" data-status="PDF_REQUIRED"><span>PDF 필요</span><strong id="count-pdf">-</strong></button><button type="button" data-status="COMPLETED"><span>반영 완료</span><strong id="count-completed">-</strong></button></section>
<section class="admin-panel admin-work-panel" aria-labelledby="work-heading"><div class="section-heading"><div><h2 id="work-heading">작업함</h2><p class="muted">각 공고에서 지금 해야 할 작업 하나만 안내합니다.</p></div></div><form id="work-search" class="admin-work-search"><label class="sr-only" for="work-query">공고명 또는 기관 검색</label><input id="work-query" type="search" placeholder="공고명 또는 기관 검색"><button class="secondary" type="submit">검색</button></form><div id="work-filter" class="admin-work-filter" aria-label="작업 상태 필터"><button class="is-selected" type="button" data-status="ALL">전체</button><button type="button" data-status="REVIEW_REQUIRED">확인 필요</button><button type="button" data-status="READY_TO_PUBLISH">반영 가능</button><button type="button" data-status="PDF_REQUIRED">PDF 필요</button><button type="button" data-status="DETAIL_AVAILABLE">상세 확보</button><button type="button" data-status="PDF_UNSUPPORTED">PDF 미지원</button></div><p id="work-result" class="admin-result" aria-live="polite"></p><div id="work-list" class="admin-work-list" aria-live="polite"></div><button id="work-more" class="secondary load-more" type="button" hidden>공고 더 보기</button></section></main></div><script type="module" src="./admin-data.js?v=20261112"></script></body></html>
