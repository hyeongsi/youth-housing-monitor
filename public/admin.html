<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>공고 수집 관리 | 청약 알림</title>
    <link rel="stylesheet" href="./app.css?v=20261102" />
    <link rel="stylesheet" href="./admin.css?v=20261102" />
  </head>
  <body>
    <div class="app-shell admin-shell">
      <header class="app-header">
        <div class="header-main">
          <a class="brand" href="/admin.html" aria-label="청약 알림 관리자 홈">청약<span>알림</span></a>
          <span class="admin-label">관리자</span>
          <a class="admin-back-link" href="/#announcements">사용자 화면으로</a>
        </div>
      </header>
      <main class="admin-main">
        <div class="view-heading admin-heading">
          <div><h1>공고 수집 관리</h1><p>기관별 수집 상태를 확인하고 필요한 경우 직접 수집합니다.</p></div>
          <button id="collect-announcements" type="button"><svg class="collection-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg><span>지금 공고 수집</span></button>
        </div>
        <p class="admin-security-note">현재 로컬 관리 화면에는 별도 인증이 없습니다. 외부 공개 전에는 관리자 인증과 API 권한 검사가 필요합니다.</p>
        <p class="admin-import-link"><a class="official" href="/admin-import.html">PDF 상세정보 가져오기</a><span>공고문 PDF를 분석하고 검토 후 상세정보로 확정합니다.</span></p>
        <div id="admin-load-error" class="initial-load-error" role="alert" hidden></div>
        <section class="admin-summary" aria-labelledby="summary-heading">
          <h2 id="summary-heading" class="sr-only">수집 요약</h2>
          <div><span>마지막 성공 수집</span><strong id="last-success">확인 중</strong></div>
          <div><span>전체 공고</span><strong id="catalog-count">-</strong></div>
          <div><span>신규 공고</span><strong id="new-count">-</strong></div>
          <div><span>갱신 공고</span><strong>집계 미지원</strong></div>
        </section>
        <p id="collection-result" class="admin-result" aria-live="polite"></p>
        <section class="admin-panel" aria-labelledby="source-heading">
          <div class="section-heading"><div><h2 id="source-heading">기관별 수집 현황</h2><p class="muted">실패한 기관은 기존 마지막 정상 데이터를 유지합니다.</p></div></div>
          <div id="monitor" class="monitor-panel" aria-live="polite"></div>
        </section>
        <section class="admin-panel" aria-labelledby="discovery-heading">
          <div class="section-heading"><div><h2 id="discovery-heading">최근 발견 공고</h2><p class="muted">최근 수집에서 새로 발견된 공고를 표시합니다.</p></div></div>
          <div id="discoveries"></div>
        </section>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./admin.js?v=20261102"></script>
  </body>
</html>
