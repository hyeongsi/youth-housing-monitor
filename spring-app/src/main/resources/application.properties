spring.application.name=housing-monitor
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:4173}
spring.web.resources.static-locations=${STATIC_LOCATIONS:file:../public/}
housing.root=${HOUSING_ROOT:..}
housing.monitor.schedule.cron=${HOUSING_MONITOR_CRON:0 0 */3 * * *}
housing.monitor.schedule.zone=${HOUSING_MONITOR_ZONE:Asia/Seoul}
housing.push.pairing-code-ttl=PT10M
spring.datasource.url=jdbc:sqlite:${housing.root}/data/housing-monitor.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=never
