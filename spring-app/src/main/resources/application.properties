spring.application.name=housing-monitor
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:4173}
spring.web.resources.static-locations=${STATIC_LOCATIONS:file:../public/}
housing.root=${HOUSING_ROOT:..}
housing.monitor.schedule.cron=${HOUSING_MONITOR_CRON:0 0 */3 * * *}
housing.monitor.schedule.zone=${HOUSING_MONITOR_ZONE:Asia/Seoul}
housing.detail.max-per-run=${HOUSING_DETAIL_MAX_PER_RUN:10}
housing.push.pairing-code-ttl=PT10M
spring.datasource.url=jdbc:sqlite:${housing.root}/data/housing-monitor.db?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=never
